name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --profile ci

  # R14's CI column, in release: S1, S2, M1 (chaperone-cli) and E1
  # (chaperone-core). L1 lands with the follower; E2 (fifty_writers) is not
  # timed here yet. --include-ignored, so a
  # budget test that loses its #[ignore] still runs here in release.
  budgets:
    name: budgets (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # M1 reads max RSS from GNU time on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y time
      - run: cargo test --release --locked -p chaperone-core -p chaperone-cli --test budgets -- --include-ignored --nocapture

  # Branch coverage is nightly-only (-Zcoverage-options=branch), so this job
  # alone runs a pinned nightly. GATED files: a missed branch or region fails
  # the job (plain match arms are regions, not branches). LEDGER_GATED files
  # (the write path): the same, counted across the unit and integration test
  # builds, with the `?` of a SQLite call exempt (.github/scripts/coverage_gate.py).
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NIGHTLY: nightly-2026-10-20
      GATED: crates/chaperone-core/src/pipeline/eval.rs
      LEDGER_GATED: crates/chaperone-core/src/ledger/write.rs crates/chaperone-core/src/ledger/fold.rs crates/chaperone-core/src/ledger/redact.rs
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      # Crash and concurrency tests gate nothing here, and instrumentation
      # eats the 50 writers' headroom under the 5 s busy limit.
      - run: cargo +"$NIGHTLY" llvm-cov nextest -p chaperone-core --locked --branch --json --output-path cov.json -E 'not (binary(crash) | binary(concurrency))'
      - name: no missed branch or region in a gated file
        run: |
          for f in $GATED; do
            jq -e --arg f "$PWD/$f" '[.data[0].files[] | select(.filename == $f)
              | .summary | select(.branches.count > 0 and .branches.covered == .branches.count
                and .regions.covered == .regions.count)] | length == 1' cov.json \
              || { echo "missed branch or region, or no branch data, in $f"; exit 1; }
          done
          python3 .github/scripts/coverage_gate.py cov.json $LEDGER_GATED

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p chaperone-core --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check
