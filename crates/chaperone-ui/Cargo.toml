[package]
name = "chaperone-ui"
description = "Read-only live board of every Chaperone lane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chaperone-ui"
path = "src/main.rs"

[dependencies]
chaperone-core = { path = "../chaperone-core" }
chaperone-graph = { path = "../chaperone-graph" }
clap.workspace = true
dirs.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
