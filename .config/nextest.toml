[profile.ci]
fail-fast = false

# Crash and concurrency tests spawn processes against one ledger each; run
# them alone so 50 writers never share the machine with another such test.
[[profile.default.overrides]]
filter = 'binary(crash) | binary(concurrency)'
threads-required = 'num-test-threads'
slow-timeout = { period = "60s", terminate-after = 1 }
