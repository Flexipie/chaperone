# v19, v17.1 with the rules pipeline v19's skills run (#105, 2026-11-08):
# - CI is not a gate: no transition reads `ci.state` (CI is shown, never required);
# - the handoff to ready needs smoke and kept tests recorded on a lane that changes code
#   (`smoke_ok`, `kept_tests_ok`), and at most `local_rounds` review rounds
#   (`rounds_at_most`), counting `review_round` session checks and daisy local reviews;
# - `kept_tests_recorded` no longer reads `kept_tests.bar_ok`, which nothing produces.
#
# Arguments: `field` and `left`/`right` are fact paths. A compared value is exactly one of
# `value` (a bool, integer or string), `value_from` (another fact path) or `limit` (a
# [limits] name); `lte`/`gt` take only an integer `value` or a `limit`. `sha_same_commit`
# takes `min_limit`/`max_limit`. The two `*_matches_lane` fns take the allowed skip
# `reasons`. `event_before` compares `quality_gate` and `pr.opened`. `all`/`any` take
# `of` (gate ids), `not` takes `of` (one gate id). A `handoff` transition is required.
#
# Rows may share an id when no route has two rows with the same id and `to`. The caller
# names the id, and the lane's route (and, for handoff, the target) picks the row.
#
# Published ids are immutable. A fix is a new file (v19.1), not an edit of this one.
# The semantic hash covers [limits], the gates and the transitions. Comments, key order,
# `published` and [cohort] do not change it.

schema = 1
id = "v19"
published = "2026-11-08T16:00:00Z"

[cohort]
target_lanes = 25

[limits]
local_rounds = 3
investigation_rounds = 1
code_lines = 750
brief_chars = 500
look_at = 3
sha_min = 7
sha_max = 40

# --- gates ---------------------------------------------------------------

[[gate]]
id = "stamp_ok"
fn = "all"
args = { of = ["stamp_id", "stamp_hash"] }

[[gate]]
id = "stamp_id"
fn = "eq"
args = { field = "pipeline.id", value = "v19" }

[[gate]]
id = "stamp_hash"
fn = "eq"
args = { field = "pipeline.hash", value_from = "loaded.hash" }

[[gate]]
id = "plan_check_recorded"
fn = "plan_check_matches_lane"
args = { reasons = ["measure", "investigation", "docs", "tests"] }

[[gate]]
id = "quality_gate_recorded"
fn = "quality_gate_matches_lane"
args = { reasons = ["no_code", "tests"] }

[[gate]]
id = "quality_gate_before_pr"
fn = "event_before"
args = { earlier = "quality_gate", later = "pr.opened" }

[[gate]]
id = "verdict_is_yes"
fn = "eq"
args = { field = "verdict.decision", value = "yes" }

[[gate]]
id = "verdict_is_no"
fn = "eq"
args = { field = "verdict.decision", value = "no" }

[[gate]]
id = "verdict_on_head"
fn = "sha_same_commit"
args = { left = "verdict.sha", right = "commit.sha", min_limit = "sha_min", max_limit = "sha_max" }

# Done needs no verdict on a lane that changes no code. A code lane with no YES verdict
# on the handed-off sha is denied as `done_verdict`.
[[gate]]
id = "done_verdict"
fn = "any"
args = { of = ["lane_no_code", "verdict_yes_on_head"] }

[[gate]]
id = "lane_no_code"
fn = "eq"
args = { field = "lane.changes_code", value = false }

[[gate]]
id = "verdict_yes_on_head"
fn = "all"
args = { of = ["verdict_is_yes", "verdict_on_head"] }

[[gate]]
id = "smoke_recorded"
fn = "eq"
args = { field = "smoke.recorded", value = true }

[[gate]]
id = "kept_tests_recorded"
fn = "eq"
args = { field = "kept_tests.recorded", value = true }

[[gate]]
id = "smoke_ok"
fn = "any"
args = { of = ["lane_no_code", "smoke_recorded"] }

[[gate]]
id = "kept_tests_ok"
fn = "any"
args = { of = ["lane_no_code", "kept_tests_recorded"] }

[[gate]]
id = "no_unexplained_failures"
fn = "eq"
args = { field = "verification.unexplained_failures", value = 0 }

[[gate]]
id = "brief_ok"
fn = "eq"
args = { field = "brief.oversize", value = false }

[[gate]]
id = "rounds_at_most"
fn = "lte"
args = { field = "review.local_rounds", limit = "local_rounds" }

# Below the cap: at most the cap and not at it, so the cap is written once.
[[gate]]
id = "rounds_below_cap"
fn = "all"
args = { of = ["rounds_at_most", "rounds_not_at_cap"] }

[[gate]]
id = "rounds_not_at_cap"
fn = "not"
args = { of = "rounds_at_cap" }

[[gate]]
id = "rounds_at_cap"
fn = "eq"
args = { field = "review.local_rounds", limit = "local_rounds" }

[[gate]]
id = "previous_round_closed"
fn = "eq"
args = { field = "review.previous_round_closed", value = true }

[[gate]]
id = "code_changed_since_review"
fn = "eq"
args = { field = "review.code_changed_since", value = true }

[[gate]]
id = "reviewed_head_ok"
fn = "any"
args = { of = ["head_eq", "no_code_since_review"] }

[[gate]]
id = "head_eq"
fn = "eq"
args = { field = "review.local_head", value_from = "commit.sha" }

[[gate]]
id = "no_code_since_review"
fn = "eq"
args = { field = "review.code_changed_since", value = false }

[[gate]]
id = "code_lines_at_most"
fn = "lte"
args = { field = "diff.code_lines", limit = "code_lines" }

[[gate]]
id = "code_lines_over"
fn = "gt"
args = { field = "diff.code_lines", limit = "code_lines" }

[[gate]]
id = "no_human_threads"
fn = "eq"
args = { field = "threads.human_open", value = 0 }

[[gate]]
id = "daisy_review_settled"
fn = "one_of"
args = { field = "daisy_review.state", values = ["absent", "finished"] }

[[gate]]
id = "pr_mergeable"
fn = "all"
args = { of = ["pr_not_draft", "pr_not_conflicting"] }

[[gate]]
id = "pr_not_draft"
fn = "eq"
args = { field = "pr.is_draft", value = false }

[[gate]]
id = "pr_not_conflicting"
fn = "eq"
args = { field = "pr.conflicting", value = false }

[[gate]]
id = "human_merge_yes"
fn = "eq"
args = { field = "human.merge_yes", value = true }

[[gate]]
id = "one_local_review_at_most"
fn = "lte"
args = { field = "review.local_rounds", limit = "investigation_rounds" }

[[gate]]
id = "decision_list_present"
fn = "present"
args = { field = "handoff.decisions" }

# Ready on code_pr. Investigation has no transition that names this.
[[gate]]
id = "ready_evidence"
fn = "all"
args = { of = [
  "stamp_ok", "plan_check_recorded", "quality_gate_recorded", "quality_gate_before_pr",
  "verdict_is_yes", "verdict_on_head", "reviewed_head_ok",
  "smoke_recorded", "kept_tests_recorded", "no_unexplained_failures", "brief_ok",
  "rounds_at_most", "no_human_threads", "daisy_review_settled", "pr_mergeable",
  "code_lines_at_most",
] }

# Ready on direct: ready_evidence without the PR gates (no PR, no threads, no pr.opened).
[[gate]]
id = "ready_evidence_direct"
fn = "all"
args = { of = [
  "stamp_ok", "plan_check_recorded", "quality_gate_recorded",
  "verdict_is_yes", "verdict_on_head", "reviewed_head_ok",
  "smoke_recorded", "kept_tests_recorded", "no_unexplained_failures", "brief_ok",
  "rounds_at_most", "daisy_review_settled",
  "code_lines_at_most",
] }

# --- M1: the gated handoff -------------------------------------------------

# A handoff with ready: true enters ready. A handoff to done, or `work update --status
# done`, enters done. Any phase. An investigation or no_pr lane has no ready row, so it
# is denied.
[[transition]]
id = "handoff"
routes = ["code_pr", "direct"]
to = "ready"
requires = [
  "stamp_ok", "plan_check_recorded", "quality_gate_recorded", "verdict_is_yes", "verdict_on_head",
  "smoke_ok", "kept_tests_ok", "rounds_at_most",
]

[[transition]]
id = "handoff"
routes = ["code_pr", "direct", "no_pr", "investigation"]
to = "done"
requires = ["stamp_ok", "plan_check_recorded", "quality_gate_recorded", "done_verdict"]

# --- code_pr -------------------------------------------------------------

[[transition]]
id = "claim_to_plan"
routes = ["code_pr", "direct", "no_pr", "investigation"]
from = "claimed"
to = "planning"

[[transition]]
id = "plan_to_build"
routes = ["code_pr", "direct", "no_pr", "investigation"]
from = "planning"
to = "building"
requires = ["plan_check_recorded"]

[[transition]]
id = "build_to_pre_pr"
routes = ["code_pr", "direct", "investigation"]
from = "building"
to = "pre_pr"

[[transition]]
id = "open_pr"
routes = ["code_pr", "investigation"]
from = "pre_pr"
to = "pr_open"
requires = ["quality_gate_recorded", "code_lines_at_most", "smoke_recorded", "kept_tests_recorded"]

[[transition]]
id = "oversize_stop"
routes = ["code_pr", "direct", "investigation"]
from = "pre_pr"
to = "needs_you"
requires = ["code_lines_over"]

[[transition]]
id = "pr_to_addressing"
routes = ["code_pr", "investigation"]
from = "pr_open"
to = "addressing"

[[transition]]
id = "start_local_review"
routes = ["code_pr", "direct"]
from = "addressing"
to = "local_review"
requires = ["rounds_below_cap"]

[[transition]]
id = "next_local_round"
routes = ["code_pr", "direct"]
from = "local_review"
to = "local_review"
requires = ["previous_round_closed", "code_changed_since_review", "rounds_below_cap"]

[[transition]]
id = "enter_final_head"
routes = ["code_pr", "direct"]
from = "local_review"
to = "final_head"
requires = ["previous_round_closed", "rounds_at_most"]

[[transition]]
id = "ask_verdict"
routes = ["code_pr"]
from = "final_head"
to = "verdict"
requires = ["reviewed_head_ok", "no_human_threads", "daisy_review_settled", "pr_mergeable", "quality_gate_before_pr"]

[[transition]]
id = "to_ready"
routes = ["code_pr"]
from = "verdict"
to = "ready"
requires = ["ready_evidence"]

[[transition]]
id = "verdict_no_below_cap"
routes = ["code_pr", "direct"]
from = "verdict"
to = "addressing"
requires = ["verdict_is_no", "rounds_below_cap"]

[[transition]]
id = "verdict_no_at_cap"
routes = ["code_pr", "direct"]
from = "verdict"
to = "needs_you"
requires = ["verdict_is_no", "rounds_at_cap"]

[[transition]]
id = "merge_on_yes"
routes = ["code_pr", "direct"]
from = "ready"
to = "done"
requires = ["human_merge_yes", "verdict_on_head"]

# --- no_pr: lanes with no PR (--pr-flow none); a code lane still needs its verdict ---

[[transition]]
id = "no_pr_done"
routes = ["no_pr"]
from = "building"
to = "done"
requires = ["plan_check_recorded", "quality_gate_recorded"]

# --- investigation: a doc PR, handoff is needs-you, never ready -----------

[[transition]]
id = "investigation_review"
routes = ["investigation"]
from = "addressing"
to = "local_review"
requires = ["one_local_review_at_most"]

[[transition]]
id = "investigation_needs_you"
routes = ["investigation"]
from = "local_review"
to = "needs_you"
requires = ["decision_list_present", "one_local_review_at_most", "plan_check_recorded"]

# --- direct: no PR, so no PR gates ------------------------------------------

# direct skips pr_open. addressing is entered from pre_pr.
[[transition]]
id = "direct_to_addressing"
routes = ["direct"]
from = "pre_pr"
to = "addressing"
requires = ["quality_gate_recorded", "code_lines_at_most"]

[[transition]]
id = "ask_verdict"
routes = ["direct"]
from = "final_head"
to = "verdict"
requires = ["reviewed_head_ok", "daisy_review_settled"]

[[transition]]
id = "to_ready"
routes = ["direct"]
from = "verdict"
to = "ready"
requires = ["ready_evidence_direct"]
