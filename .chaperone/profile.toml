# The pipeline profile of this repo. Chaperone reads it from the base
# branch's remote ref (origin), never from a worktree, so a lane's own edit
# is not used: an edit takes effect once it is merged. The ref lives in the
# lane's clone, so this is a speed bump, not a guarantee.
slug = "Flexipie/chaperone"
name = "chaperone"

[tracker]
kind = "github"
key = "#[0-9]+"

[git]
base = "main"
branch = "{short}"

[pr]
flow = "pr"
create = "gh"
address = "builtin"
merge = "squash"
stack = "none"

[review]
daisy = false

# Files that are code even under docs or in Markdown: prompts and skills are
# pipeline behaviour.
[diff]
code = ["pipelines/**", "plugin/**"]

[lanes]
enabled = true

[ledger]
kind = "chaperone"

# What `chaperone check run tests` runs, in order, in a checkout of the
# lane's commit: each an argv, never a shell string. `target_dir` names the
# variable the harness points at the lane's own build directory. CI also
# runs the llvm-cov coverage gate, which is not here: a harness pass is not
# CI green.
[tests]
commands = [
  ["cargo", "fmt", "--check"],
  ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "nextest", "run", "--workspace", "--locked"],
]
target_dir = "CARGO_TARGET_DIR"

# Entry points: what `chaperone impact --entry-points` reports (#44).
# Each command names the file that implements it, not main.rs: the
# dispatcher depends on every command, so a rule on it is reached by all.
[[entry_points]]
kind = "command"
name = "work"
path = "crates/chaperone-cli/src/work.rs"

[[entry_points]]
kind = "command"
name = "spec"
path = "crates/chaperone-cli/src/spec.rs"

[[entry_points]]
kind = "command"
name = "check"
path = "crates/chaperone-cli/src/checks.rs"

[[entry_points]]
kind = "command"
name = "reviews"
path = "crates/chaperone-cli/src/checks.rs"

[[entry_points]]
kind = "command"
name = "jobs"
path = "crates/chaperone-cli/src/checks.rs"

[[entry_points]]
kind = "command"
name = "usage"
path = "crates/chaperone-cli/src/checks.rs"

[[entry_points]]
kind = "command"
name = "attention"
path = "crates/chaperone-cli/src/checks.rs"

[[entry_points]]
kind = "command"
name = "dossier"
path = "crates/chaperone-cli/src/checks.rs"

[[entry_points]]
kind = "command"
name = "stats"
path = "crates/chaperone-core/src/stats.rs"

[[entry_points]]
kind = "command"
name = "migrate"
path = "crates/chaperone-core/src/ledger/migrate.rs"

[[entry_points]]
kind = "command"
name = "impact"
path = "crates/chaperone-cli/src/impact.rs"

[[entry_points]]
kind = "command"
name = "overlap"
path = "crates/chaperone-cli/src/overlap.rs"

# Every tracked file must be in exactly one area, or impact --entry-points refuses.
[areas]
cli = ["crates/chaperone-cli/**"]
lanes = ["crates/chaperone-core/src/*.rs", "crates/chaperone-core/src/spec/**", "crates/chaperone-core/src/usage/**", "crates/chaperone-core/src/work/**"]
ledger = ["crates/chaperone-core/src/ledger/**", "crates/chaperone-core/migrations/**"]
engine = ["crates/chaperone-core/src/pipeline/**", "pipelines/**"]
graph = ["crates/chaperone-graph/**"]
ui = ["crates/chaperone-ui/**"]
tests = ["crates/chaperone-core/tests/**", "crates/chaperone-fake/**"]
build = ["Cargo.toml", "Cargo.lock", "crates/chaperone-core/Cargo.toml", "rust-toolchain.toml", "rustfmt.toml", "deny.toml", ".gitignore", ".config/**", ".github/**", ".chaperone/**"]
docs = ["docs/**", "README.md", "CONTRIBUTING.md", "LICENSE-APACHE", "LICENSE-MIT"]
spikes = ["spikes/**"]
