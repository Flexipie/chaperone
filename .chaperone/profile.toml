# The pipeline profile of this repo. Chaperone reads it from the base
# branch's remote ref (origin), never from a worktree, so a lane's own edit
# is not used: an edit takes effect once it is merged. The ref lives in the
# lane's clone, so this is a speed bump, not a guarantee.
slug = "Flexipie/chaperone"
name = "chaperone"

[tracker]
kind = "github"
key = "#[0-9]+"

[git]
base = "main"
branch = "{short}"

[pr]
flow = "pr"
create = "gh"
address = "builtin"
merge = "squash"
stack = "none"

[review]
daisy = false

# Files that are code even under docs or in Markdown: prompts and skills are
# pipeline behaviour.
[diff]
code = ["pipelines/**", "plugin/**"]

# Companion rules: `check run diff` refuses a commit that changes a file
# `when` names and none `needs` names, unless a lane commit has the trailer
# `No-companion: <name> <why>`.
[[companions]]
name = "cli-contract"
when = ["crates/chaperone-cli/src/cli.rs"]
needs = ["docs/cli-contract.md"]

[lanes]
enabled = true

[ledger]
kind = "chaperone"

# What `chaperone check run tests` runs, in order, in a checkout of the
# lane's commit: each an argv, never a shell string. `target_dir` names the
# variable the harness points at the lane's own build directory. The doc
# job is here as CI runs it. CI also runs coverage, budgets, deny and
# doc-numbers (which needs the PR's merge commit), which are not: a harness
# pass is not CI green.
[tests]
commands = [
  ["cargo", "fmt", "--check"],
  ["cargo", "clippy", "--workspace", "--all-targets", "--locked", "--", "-D", "warnings"],
  ["cargo", "nextest", "run", "--workspace", "--locked"],
  ["env", "RUSTDOCFLAGS=-D warnings", "cargo", "doc", "-p", "chaperone-core", "--no-deps", "--locked"],
]
target_dir = "CARGO_TARGET_DIR"

# Test files: `check run diff` counts their lines as `test_lines`, which the size cap
# leaves out. Tests inside a source file still count as code.
[size]
tests = ["crates/*/tests/**"]
